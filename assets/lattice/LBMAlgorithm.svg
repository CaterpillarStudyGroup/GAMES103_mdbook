<svg viewBox="0 0 680 364" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>LBM 一个时间步的流程</title>
  <desc>依次计算宏观量、平衡分布、碰撞、迁移、边界条件，然后进入下一时间步。</desc>
  <defs>
    <marker id="aN" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="160" y="40" width="320" height="48" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="320" y="58" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">1  计算宏观量</text>
  <text x="320" y="76" font-size="12" fill="#185FA5" text-anchor="middle">ρ = Σ f_i，ρu = Σ c_i f_i</text>
  <rect x="160" y="104" width="320" height="48" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="320" y="122" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">2  计算平衡分布</text>
  <text x="320" y="140" font-size="12" fill="#185FA5" text-anchor="middle">f_i^eq 由 ρ 与 u 的多项式给出</text>
  <rect x="160" y="168" width="320" height="48" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="320" y="186" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">3  碰撞 Collision</text>
  <text x="320" y="204" font-size="12" fill="#185FA5" text-anchor="middle">f_i ← f_i − (f_i − f_i^eq) / τ</text>
  <rect x="160" y="232" width="320" height="48" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="320" y="250" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">4  迁移 Streaming</text>
  <text x="320" y="268" font-size="12" fill="#185FA5" text-anchor="middle">f_i(x) → f_i(x + c_i Δt)</text>
  <rect x="160" y="296" width="320" height="48" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="320" y="314" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">5  施加边界条件</text>
  <text x="320" y="332" font-size="12" fill="#185FA5" text-anchor="middle">周期 / 反弹 / Zou-He / 自由表面</text>
  <path d="M320 88 L320 104" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#aN)"/>
  <path d="M320 152 L320 168" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#aN)"/>
  <path d="M320 216 L320 232" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#aN)"/>
  <path d="M320 280 L320 296" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#aN)"/>
  <path d="M160 320 L110 320 L110 64 L160 64" fill="none" stroke="#888780" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#aN)"/>
  <text x="100" y="192" font-size="12" fill="#5F5E5A" text-anchor="end">下一时间步</text>
</svg>
