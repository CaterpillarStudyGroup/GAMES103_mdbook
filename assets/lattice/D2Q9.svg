<svg viewBox="0 0 560 400" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>D2Q9 速度模板</title>
  <desc>二维九方向速度模板，包含一个静止方向、四个轴向方向和四个对角方向，以及各自的权重。</desc>
  <defs>
