  <path d="M269 189 L236 156" fill="none" stroke="#378ADD" stroke-width="1.5" marker-end="url(#aB)"/>
  <path d="M291 211 L324 244" fill="none" stroke="#378ADD" stroke-width="1.5" marker-end="url(#aB)"/>
  <path d="M269 211 L236 244" fill="none" stroke="#378ADD" stroke-width="1.5" marker-end="url(#aB)"/>
  <circle cx="188" cy="108" r="5" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
  <circle cx="280" cy="108" r="5" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
  <circle cx="372" cy="108" r="5" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
  <circle cx="188" cy="200" r="5" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
  <circle cx="280" cy="200" r="8" fill="#1D9E75" stroke="#0F6E56" stroke-width="0.5"/>
