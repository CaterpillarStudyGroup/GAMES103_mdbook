  <text x="398" y="196" font-size="12" fill="#0C447C">i=1  c=(1,0)  w=1/9</text>
  <text x="162" y="196" font-size="12" fill="#0C447C" text-anchor="end">i=3  c=(-1,0)  w=1/9</text>
  <text x="280" y="86" font-size="12" fill="#0C447C" text-anchor="middle">i=2  c=(0,1)  w=1/9</text>
  <text x="280" y="316" font-size="12" fill="#0C447C" text-anchor="middle">i=4  c=(0,-1)  w=1/9</text>
  <text x="398" y="134" font-size="12" fill="#0C447C">i=5  c=(1,1)  w=1/36</text>
