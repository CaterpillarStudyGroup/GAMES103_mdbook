      <path d="M2 1L8 5L2 9" fill="none" stroke="#378ADD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <path d="M188 108 L280 108 L372 108 M188 200 L188 108 M280 200 L280 108 M372 200 L372 108 M188 292 L188 200 M280 292 L280 200 M372 292 L372 200 M188 292 L280 292 L372 292 M188 108 L188 292 M280 108 L280 292 M372 108 L372 292" fill="none" stroke="#D3D1C7" stroke-width="0.5"/>
  <path d="M296 200 L356 200" fill="none" stroke="#378ADD" stroke-width="1.5" marker-end="url(#aB)"/>
  <path d="M264 200 L204 200" fill="none" stroke="#378ADD" stroke-width="1.5" marker-end="url(#aB)"/>
  <path d="M280 184 L280 138" fill="none" stroke="#378ADD" stroke-width="1.5" marker-end="url(#aB)"/>
