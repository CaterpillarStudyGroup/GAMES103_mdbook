  <text x="280" y="352" font-size="12" fill="#5F5E5A" text-anchor="middle">i = 0 为静止方向：c = (0,0)，w = 4/9</text>
  <text x="280" y="378" font-size="12" fill="#5F5E5A" text-anchor="middle">格子单位：Δx = Δt = 1，c_s² = 1/3</text>
