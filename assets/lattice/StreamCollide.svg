<svg viewBox="0 0 680 270" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>格子气的碰撞与迁移两步</title>
  <desc>左图为碰撞：同一格点内粒子重排方向，粒子数与动量守恒。右图为迁移：每个粒子沿自身方向精确走到相邻格点。</desc>
  <defs>
    <marker id="aCoral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="aBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#378ADD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="aG2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#639922" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="50" y="50" width="270" height="200" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="185" y="74" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">碰撞 Collision</text>
  <text x="185" y="92" font-size="12" fill="#185FA5" text-anchor="middle">同一格点内重排方向</text>
  <circle cx="185" cy="160" r="9" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
  <path d="M95 160 L168 160" fill="none" stroke="#D85A30" stroke-width="1.5" marker-end="url(#aCoral)"/>
  <path d="M275 160 L202 160" fill="none" stroke="#D85A30" stroke-width="1.5" marker-end="url(#aCoral)"/>
  <path d="M185 141 L185 108" fill="none" stroke="#378ADD" stroke-width="1.5" marker-end="url(#aBlue)"/>
  <path d="M185 179 L185 212" fill="none" stroke="#378ADD" stroke-width="1.5" marker-end="url(#aBlue)"/>
  <text x="185" y="234" font-size="12" fill="#185FA5" text-anchor="middle">对头碰撞转向 90°，Σn_i 与 Σc_i n_i 不变</text>
  <rect x="360" y="50" width="270" height="200" rx="12" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="495" y="74" font-size="13" font-weight="500" fill="#27500A" text-anchor="middle">迁移 Streaming</text>
  <text x="495" y="92" font-size="12" fill="#3B6D11" text-anchor="middle">沿 c_i 搬到相邻格点</text>
  <g fill="#FFFFFF" stroke="#3B6D11" stroke-width="0.5">
    <circle cx="420" cy="140" r="6"/><circle cx="495" cy="140" r="6"/><circle cx="570" cy="140" r="6"/>
    <circle cx="420" cy="200" r="6"/><circle cx="495" cy="200" r="6"/><circle cx="570" cy="200" r="6"/>
  </g>
  <path d="M428 140 L487 140" fill="none" stroke="#639922" stroke-width="1.5" marker-end="url(#aG2)"/>
  <path d="M503 140 L562 140" fill="none" stroke="#639922" stroke-width="1.5" marker-end="url(#aG2)"/>
  <path d="M428 200 L487 200" fill="none" stroke="#639922" stroke-width="1.5" marker-end="url(#aG2)"/>
  <path d="M503 200 L562 200" fill="none" stroke="#639922" stroke-width="1.5" marker-end="url(#aG2)"/>
  <text x="495" y="234" font-size="12" fill="#27500A" text-anchor="middle">位移恰为一格，不需要插值</text>
</svg>
